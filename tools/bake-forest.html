<!doctype html>
<script type="module">
  import * as T from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  const renderer = new T.WebGLRenderer({
    alpha: true,
    antialias: true,
    preserveDrawingBuffer: true,
  });
  renderer.setSize(768, 768);
  renderer.setClearColor(0, 0);
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  document.body.append(renderer.domElement);
  window.bake = async (name) => {
    const scene = new T.Scene(),
      model = (
        await new GLTFLoader().loadAsync("/assets/models/" + name + ".glb")
      ).scene,
      loader = new T.TextureLoader();
    const leaf = await loader.loadAsync(
      "/assets/botanical/" + (name === "broadleaf" ? "oak" : "pine") + ".png",
    );
    leaf.colorSpace = T.SRGBColorSpace;
    const bark = await loader.loadAsync(
      "/assets/botanical/pine-bark-Color.jpg",
    );
    bark.colorSpace = T.SRGBColorSpace;
    bark.wrapS = bark.wrapT = T.RepeatWrapping;
    bark.repeat.set(1, 4);
    model.traverse((o) => {
      if (o.isMesh)
        o.material = new T.MeshStandardMaterial({
          map: o.material.name === "photobark" ? bark : leaf,
          alphaTest: 0.35,
          roughness: 1,
          side: T.DoubleSide,
          color: o.material.name === "photobark" ? 0xb9b5a4 : 0xa5ae8b,
        });
    });
    scene.add(model, new T.HemisphereLight(0xdce9ec, 0x59693d, 2.6));
    const sun = new T.DirectionalLight(0xffe2a6, 3);
    sun.position.set(-20, 30, 30);
    scene.add(sun);
    const box = new T.Box3().setFromObject(model),
      center = box.getCenter(new T.Vector3()),
      size = box.getSize(new T.Vector3()),
      extent = Math.max(size.x, size.y) * 0.55;
    const camera = new T.OrthographicCamera(
      -extent,
      extent,
      extent,
      -extent,
      0.1,
      200,
    );
    camera.position.set(center.x, center.y, 80);
    camera.lookAt(center);
    renderer.render(scene, camera);
    return {
      url: renderer.domElement.toDataURL("image/png"),
      width: extent * 2,
      height: extent * 2,
      centerY: center.y,
    };
  };
</script>
